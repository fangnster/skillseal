name: SkillSeal CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    name: App, protocol tests and local demo
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run demo
      - run: pnpm run build

  contract:
    name: Anchor host compile and formatting
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: anchor
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt
      - run: cargo +1.99.0 fmt --all -- --check
      - run: cargo +1.99.0 check --locked --lib
      # This host check is not a substitute for compiled SBF integration tests.
