name: SkillSeal CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: skillseal-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: App, protocol tests and local demo
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run demo
      - run: pnpm run build:distribution
      - run: pnpm run test:distribution
      - run: pnpm run build
      - run: pnpm prune --prod
      - run: pnpm run build:runtime
      - run: node --experimental-strip-types scripts/test-runtime.ts
      - name: Build public Devnet program artifact
        env:
          DEVNET_PROGRAM_ID: AXwhEjRZEqA8Yz6C5gyToudg65UZie8nXuJvbd83LKQu
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup default 1.99.0
          mkdir -p /tmp/skillseal-agave /tmp/skillseal-sbf
          curl --fail --location --retry 3 https://github.com/anza-xyz/agave/releases/download/v2.3.13/solana-release-x86_64-unknown-linux-gnu.tar.bz2 -o /tmp/skillseal-agave/release.tar.bz2
          tar -xjf /tmp/skillseal-agave/release.tar.bz2 -C /tmp/skillseal-agave
          cp -R anchor /tmp/skillseal-sbf/anchor
          sed -i -E "s/declare_id!\(\"[1-9A-HJ-NP-Za-km-z]+\"\)/declare_id!(\"$DEVNET_PROGRAM_ID\")/" /tmp/skillseal-sbf/anchor/programs/skill-vault/src/lib.rs
          /tmp/skillseal-agave/solana-release/bin/cargo-build-sbf --tools-version v1.53 --manifest-path /tmp/skillseal-sbf/anchor/programs/skill-vault/Cargo.toml --sbf-out-dir /tmp/skillseal-sbf/artifacts -j 2
          cp /tmp/skillseal-sbf/artifacts/skill_vault.so site-dist/downloads/skillseal-devnet-program.so
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          import { createHash } from 'node:crypto';
          const bytes = fs.readFileSync('site-dist/downloads/skillseal-devnet-program.so');
          const record = { cluster: 'devnet', programId: process.env.DEVNET_PROGRAM_ID, sourceCommit: process.env.GITHUB_SHA, sha256: createHash('sha256').update(bytes).digest('hex'), bytes: bytes.length, agave: '2.3.13', platformTools: 'v1.53', deployment: 'Build artifact only; verify deployment separately.' };
          fs.writeFileSync('site-dist/downloads/skillseal-devnet-program.json', JSON.stringify(record, null, 2) + '\n');
          console.log(record);
          JS
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          path: site-dist

  contract:
    name: Anchor host compile and formatting
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: anchor
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt
      - run: cargo +1.99.0 fmt --all -- --check
      - run: cargo +1.99.0 check --locked --lib
      # This host check is not a substitute for compiled SBF integration tests.

  website:
    name: Publish verified website and installer
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [app, contract]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
